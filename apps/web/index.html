<!doctype html>
<html lang="fr" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Koinon : la caisse Bitcoin d'une association, qui s'ouvre avec deux clés. Regtest, Dakar Bitcoin Hack 2026." />
    <meta name="theme-color" content="#100e0c" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Koinon · la caisse à deux clés</title>
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("koinon.theme");
          var theme = saved === "light" || saved === "dark" ? saved : window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          document.documentElement.dataset.theme = theme;
          var lang = localStorage.getItem("koinon.lang");
          if (lang === "en" || lang === "fr") document.documentElement.lang = lang;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
